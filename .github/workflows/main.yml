name: Build and Deploy Jeopardy to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: mssa-jeopardy-jamesgill
  PROJECT_PATH: "MSSA Jeopardy/MSSA Jeopardy.csproj"
  PUBLISH_DIR: publish_output
  ZIP_NAME: app.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish (Release)
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      # Debug: prove to ourselves publish output is real
      - name: Show publish output (debug)
        run: |
          echo "=== Listing ${{ env.PUBLISH_DIR }} ==="
          ls -la "${{ env.PUBLISH_DIR }}"
          echo "=== Top 50 files ==="
          find "${{ env.PUBLISH_DIR }}" -maxdepth 2 -type f | head -n 50

      # Make a ZIP that contains the *contents* of publish_output (not the folder nesting)
      - name: Create deployment zip
        run: |
          cd "${{ env.PUBLISH_DIR }}"
          zip -r "../${{ env.ZIP_NAME }}" .
          cd ..
          echo "=== Zip created ==="
          ls -la "${{ env.ZIP_NAME }}"

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: deploy_zip
          path: ${{ env.ZIP_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact (zip)
        uses: actions/download-artifact@v4
        with:
          name: deploy_zip

      - name: Show downloaded files (debug)
        run: ls -la

      - name: Deploy to Azure Web App (Publish Profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ${{ env.ZIP_NAME }}
