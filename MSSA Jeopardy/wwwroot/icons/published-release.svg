<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Published Release Icon</title>
  <desc id="desc">A shield and check mark icon representing a published software release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2c7a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a" />
      <stop offset="100%" stop-color="#d89f2d" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" />
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#8ab4ff" stroke-width="6" opacity="0.45" />
  <path d="M128 40 196 68v55c0 42-28 77-68 93-40-16-68-51-68-93V68z" fill="#10338f" stroke="#95bdff" stroke-width="6" />
  <path d="m91 125 25 25 49-49" fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
